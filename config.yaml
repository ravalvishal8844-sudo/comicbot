- name: spongebob
  title: "🧽 Губка Боб"
  prompt: |
    Мультсериал «Губка Боб Квадратные Штаны» (SpongeBob SquarePants, Nickelodeon): подводный городок Бикини-Боттом, ресторан «Красти Краб».
    Рисовка: толстый чёрный контур, очень яркие насыщенные цвета, подводный фон с цветами-облаками, дом-ананас, пузырьки, рыбы-горожане на заднем плане.
    Обязательно в кадре 3–4 узнаваемых героя в канонических образах — выбери тех, чей характер подходит участникам чата: Губка Боб (жёлтая квадратная губка в коричневых квадратных штанах, белая рубашка и красный галстук, большие голубые глаза, два передних зуба, восторженный энтузиаст), Патрик (розовая морская звезда в зелёных шортах с фиолетовыми цветами, туповатый лучший друг), Сквидвард (бирюзовый осьминог с большим носом, коричневая футболка, выгоревший циник с кларнетом, ненавидит свою работу), мистер Крабс (красный краб-босс, одержим деньгами, «Деньги, деньги!»), Планктон (крошечный зелёный одноглазый злодей из «Помойного ведра», вечно крадёт секретную формулу), Сэнди (белка в скафандре, учёная из Техаса), улитка Гэри («мяу»), миссис Пафф.
    Детали мира: «Красти Краб» как офис — мистер Крабс управляет, Сквидвард на кассе страдает, Губка Боб жарит крабсбургеры с восторгом, Планктон строит козни.
    Настроение: детская наивность, доведённая до абсурда, и офисный ад на дне океана.
- name: south_park
  title: "🏔 Южный Парк"
  prompt: |
    Мультсериал «Южный Парк» (South Park) Трея Паркера и Мэтта Стоуна: заснеженный городок в горах Колорадо.
    Рисовка: ОБЯЗАТЕЛЬНО стиль аппликации из цветной бумаги — простые геометрические фигуры, большие круглые головы, глаза-точки, крошечные рты, дёрганые позы, плоские цвета без теней, снег и одноэтажные домики на фоне.
    Обязательно в кадре 3–4 узнаваемых героя в канонических образах — выбери тех, чей характер подходит участникам чата: Эрик Картман (толстый, красная куртка, сине-жёлтая шапка, эгоист и манипулятор, «Я не толстый, я крупнокостный»), Стэн Марш (синяя шапка с красным помпоном, коричневая куртка, здравомыслящий), Кайл Брофловски (зелёная ушанка, оранжевая куртка, вечно спорит с Картманом), Кенни Маккормик (оранжевая парка с капюшоном, закрывающим лицо, бормочет и погибает в каждой серии), Баттерс (блондин, бирюзовая куртка, наивный), Рэнди Марш (усатый отец, который доводит любую идею до абсурда), мистер Гаррисон, мистер Мэки («м'кей»), Полотенчик.
    Если кто-то в переписке пострадал — это Кенни, и кто-нибудь обязан крикнуть «О боже, они убили Кенни!».
    Настроение: грубая сатира с невозмутимыми лицами, взрослые ведут себя хуже детей.
- name: scooby_doo
  title: "🐕 Скуби-Ду"
  prompt: |
    Мультсериал «Скуби-Ду» (Scooby-Doo, Hanna-Barbera / Warner Bros.): корпорация «Тайна» расследует загадки.
    Рисовка: классическая анимация Hanna-Barbera 1970-х — толстый контур, плоские цвета, мрачные фоны (заброшенный особняк, туман, кладбище, старая фабрика), фургон «Мистическая машина» (бирюзовый с оранжевыми цветами).
    Обязательно в кадре 3–5 узнаваемых героев в канонических образах — выбери тех, чей характер подходит участникам чата: Скуби-Ду (коричневый немецкий дог с чёрными пятнами, синий ошейник с биркой SD, трус и обжора, говорит «Р-р-руби-дуби-ду!»), Шэгги (долговязый, зелёная футболка, коричневые штаны, козлиная бородка, вечно голодный трус), Фред (блондин, белый свитер, синие штаны, оранжевый шейный платок, строит ловушки и говорит «Разделимся!»), Дафна (рыжая, фиолетовое платье, зелёный шарф, вечно попадает в беду), Велма (короткие каштановые волосы, оранжевая водолазка, очки, мозг команды, «Мои очки! Я ничего не вижу без очков!»).
    Детали мира: злодей в маске призрака, которого в конце разоблачают — «И у меня бы всё получилось, если бы не вы, проклятые детишки!», скуби-снеки, погоня через анфиладу дверей.
    Настроение: любая проблема из переписки — это «призрак», которого банда ловит и срывает с него маску, а под маской — виновник из переписки.
- name: adventure_time
  title: "⚔️ Время приключений"
  prompt: |
    Мультсериал «Время приключений» (Adventure Time) Пендлтона Уорда: Земля Ууу после Грибной войны.
    Рисовка: тонкие руки-ноги-макаронины, простые круглые лица, глаза-точки, пастельные леденцовые цвета, сюрреалистичные пейзажи — Конфетное королевство, Ледяное королевство, Домик на дереве.
    Обязательно в кадре 3–4 узнаваемых героя в канонических образах — выбери тех, чей характер подходит участникам чата: Финн (белая шапка с медвежьими ушками, голубая футболка и шорты, зелёный рюкзак, меч, бесстрашный герой), Джейк (жёлтый растягивающийся пёс, меняет форму тела, ленивый философ), принцесса Бубльгум (розовая, корона, учёная-правительница), Марселин (королева вампиров, серая кожа, длинные чёрные волосы, бас-топор), Ледяной король (синяя кожа, корона, длинная борода, одинокий неудачник), БиМО (маленькая бирюзовая игровая приставка с лицом), принцесса Пупырчатого королевства (фиолетовое облако, капризная), граф Лимонхват («НЕПРИЕМЛЕМО!»).
    Любимые словечки героев: «Алгебраично!», «Математика!», «Неприемлемо!».
    Настроение: сюрреалистичный абсурд с детской серьёзностью, любая проблема решается квестом и мечом.
- name: brickleberry
  title: "🌲 Бриклберри"
  reference_image: references/bricklberry.png
  reference_group: true
  prompt: |
    Мультсериал «Бриклберри» (Brickleberry) Вако О'Гуина и Роджера Блэка: захолустный национальный парк и его рейнджеры-дегенераты.
    Рисовка: как на приложенном референсе — взрослая американская телеанимация 2010-х, чёткий чёрный контур, плоские цвета без градиентов, округлые тела, маленькие глаза-точки с веками, уродливо-выразительные лица; рейнджерская форма цвета хаки с тёмно-зелёными брюками и шевроном-ёлкой на рукаве; лес, домик рейнджеров из брёвен, деревянная вывеска парка.
    Карта референса СЛЕВА НАПРАВО (внешность каждого бери строго с его фигуры):
    1. Конни Канаман — самая широкая и коренастая, короткие рыжие волосы, круглое щекастое лицо, рубашка хаки с ШОРТАМИ, гольфы в красно-белую полоску, бурые ботинки.
    2. Этель Андерсон — стройная блондинка с пышными волнистыми волосами до плеч, ярко-розовые губы, приталенная форма хаки с брюками.
    3. Вуди Джонсон — высокий пузатый начальник в центре: зачёсанные светлые волосы, густые светлые усы, массивный подбородок, БЕЛАЯ рубашка с золотым значком (единственный не в хаки).
    4. Мэллой — маленький коричневый медвежонок ростом по колено, злые прищуренные глаза, насупленные брови.
    5. Стив Уильямс — тёмно-каштановая уложенная чёлка, вечно открытый орущий рот, зелёный галстук, рация и фонарик на поясе.
    6. Дензел Джексон — самый высокий и худой, темнокожий, короткие чёрные волосы, сонные полуприкрытые глаза, значок на шнурке на шее.
    Бери в кадр тех, кто нужен сюжету: иногда это один-два героя крупно, иногда вся банда в хаосе — по ситуации, всех подряд не тащи. Каждый, кто попал в кадр, — ровно один раз, со своим лицом и причёской с референса. Лица и головы между героями не путать и не копировать: рыжая коренастая — только Конни, блондинка — только Этель, усы — только у Вуди, темнокожий — только Дензел, медведь — только Мэллой.
    Имена на картинке не подписывай. Роли участников чата раздай героям по характеру реплик:
    - Этель — блондинка-сексоголик, вечно на взводе: её застают врасплох раскрасневшейся, с рукой подозрительно под столом или в кустах, рядом «случайно» жужжит коробка.
    - Конни — по уши влюблена в Этель и хочет её затащить в постель: пожирает её взглядом, пускает слюни, лезет обниматься, носит её фото в нагрудном кармане; при этом сильнее медведя и поднимает машины.
    - Дензел — невозмутимый ловелас, которого заводят только старушки: подмигивает бабуле-туристке с ходунками, следы помады на щеке, вставная челюсть торчит из кармана.
    - Стив — самовлюблённый идиот, «лучший рейнджер месяца», всё портит и случайно калечит животных.
    - Вуди — орущий начальник-самодур, похабный ветеран, ради денег продаст парк кому угодно.
    - Мэллой — избалованный хамоватый медвежонок-циник с банкой пива и геймпадом, единственный понимает, что происходит, и издевается над всеми.
    Фон и шутки: трупики зверушек после Стива, таблички «Не кормить рейнджеров», бутылки, деревенщины, сбитый олень на капоте.
    Композиция: безумная и динамичная — драки, погони, взрывы, падения, неловкие «застукали», искажённые ракурсы. НИКАКОГО группового фото в ряд.
    Настроение: грязный чёрный юмор и пошлость в духе сериала — похабные намёки, двусмысленные позы, неловкие ситуации «застукали», без наготы и показа секса (на откровенное Gemini отвечает отказом).
# Стили-«подъёбы»: жанры и форматы без чужих персонажей — лицензировать нечего, Gemini на них
# не отказывает. Героев сцены здесь играют сами участники чата, типаж выводится из их реплик.
- name: sharzh
  title: "✏️ Дружеский шарж"
  prompt: |
    Дружеский шарж — злая карикатура на самих участников чата.
    Рисовка: уверенный карикатурный рисунок тушью с мягкой акварельной заливкой, огромные головы на крошечных телах, утрированные черты лица — нос, подбородок, уши, причёска, очки преувеличены в 2–3 раза, глянцевые блики, лёгкий пастельный фон.
    Персонажи — сами участники чата. Внешность и типаж каждого выводи из его реплик: кто командует — надутый начальник с двойным подбородком, кто ноет — опухший от слёз страдалец, кто умничает — очкарик с лбом в полкадра, кто молчит и «ждёт» — сонный персонаж с чашкой кофе и засохшим растением. Рядом с каждым — мелкая деталь-улика его поведения из переписки.
    Текст: одна ядовитая подпись-диагноз внизу (до 8 слов), не цитата, а приговор.
    Настроение: беззлобно по форме и беспощадно по сути — каждый узнаёт себя и ему неловко.
- name: krokodil
  title: "🐊 Карикатура «Крокодил»"
  prompt: |
    Советская сатирическая карикатура в духе журналов 1960–80-х («Крокодил», Кукрыниксы).
    Рисовка: бойкий рисунок пером и тушью с акварелью, гротескные типажи — толстые бюрократы в пиджаках с портфелями, прогульщики с папиросой, очковтиратели с «липовыми» отчётами, кумушки с авоськами; выразительные носы и животы, штриховка, выцветшая газетная бумага, под рисунком курсивная подпись-диалог в формате «— Реплика. — Ответ.».
    Персонажи — сами участники чата как классические мишени советской сатиры: бюрократ, халтурщик, бездельник, подхалим, паникёр. Кто какой — реши по репликам. На заднем плане: плакат на стене, график «план/факт», стопка бумаг до потолка, таблички и вывески с язвительными надписями.
    Текст: подпись-диалог из двух коротких реплик (каждая до 7 слов), бьющая по реальному косяку из переписки.
    Настроение: фельетон — высмеять так, чтобы было стыдно, но смешно.
- name: agitplakat
  title: "☭ Агитплакат"
  prompt: |
    Советский агитационный плакат 1920–50-х.
    Рисовка: ограниченная палитра — красный, чёрный, бежевый, немного белого; плоские обобщённые формы, резкие диагонали, монументальные героические позы с указующим перстом, зернистая печать, крупный лозунг рубленым конструктивистским шрифтом с восклицательным знаком, лучи и шестерёнки на фоне.
    Персонажи — сами участники чата в образах с плаката: ударник труда, бдительный товарищ, лодырь на скамье, болтун с раскрытым ртом, враг прогресса с мешком багов. Кто кем стал — по репликам: самого активного — в героя, самого бесполезного — в отрицательный персонаж, которого герой разоблачает.
    Текст: ОДИН лозунг на весь плакат (до 7 слов), издевательски переосмысляющий проблему из переписки в духе «НЕ БОЛТАЙ!», «ТЫ ЗАКРЫЛ ТАСК?», «ДЕДЛАЙН НЕ ЖДЁТ!».
    Настроение: пафос стройки коммунизма, обращённый на мелкую склоку из чата.
- name: lubok
  title: "🪆 Лубок"
  prompt: |
    Русский народный лубок XVIII–XIX века.
    Рисовка: лубочная гравюра — грубый чёрный контур, плоские наивные фигуры без перспективы, раскраска в 3–4 цвета (красный, жёлтый, зелёный, синий), орнаментальная рамка, персонажи в кафтанах, сарафанах, лаптях и картузах, нелепые пропорции, узорчатые деревья и избы, самовар, медведь, кот.
    Персонажи — сами участники чата как лубочные герои: барин, скоморох, купец, поп, баба с коромыслом, пьяный мужик, учёный кот. Распредели по репликам: кто командует — барин, кто паясничает — скоморох, кто вещает и поучает — поп.
    Текст: одна подпись в верхней части на псевдостарославянский лад с ятями и титлами (до 10 слов), рифмованная или в духе «Се есть Антонъ, иже багъ не чинитъ, а токмо вздыхаетъ».
    Настроение: ярмарочная потеха — зеваки смеются над знакомыми типажами.
- name: bukvar
  title: "📖 Букварь"
  prompt: |
    Иллюстрация из советского букваря или учебника для 1-го класса (1970-е).
    Рисовка: чистый наивный рисунок с мягкой гуашевой заливкой, округлые добрые лица, аккуратная штриховка, светлые тёплые цвета, пожелтевшая страница с полями и номером страницы, подпись крупным печатным шрифтом с ударениями, как в учебнике, рядом — «словарные» картинки-пояснения.
    Персонажи — сами участники чата, нарисованные как примерные дети и взрослые из букваря (школьная форма, бантики, пионерские галстуки, дядя в пиджаке), но заняты они тем, что происходило в переписке.
    Текст: 2–3 коротких предложения букварного тона (каждое до 6 слов), от которых и смешно, и обидно: «Это Антон. Антон не чинит баг. Антон ждёт.». Имена бери из переписки.
    Настроение: невинная интонация учебника, которой прямо в лоб описывают чужую несостоятельность.
- name: demotivator
  title: "🖤 Демотиватор"
  prompt: |
    Демотиватор — классическая картинка-мем русского интернета 2010-х.
    Формат: широкая чёрная рамка, внутри — картинка с тонкой белой окантовкой, под ней крупная белая надпись с засечками (заглавными буквами) и строкой ниже мелким шрифтом. Картинка внутри — нарочито пафосная, как стоковое фото или кадр из драмы: драматичный свет, серьёзные лица, реалистичная рисовка.
    Персонажи — сами участники чата в самой нелепой ситуации из переписки, изображённой с лицом Героя Эпоса; весь юмор — в контрасте пафоса картинки и убийственной подписи.
    Текст: ТОЛЬКО две строки под картинкой: заголовок заглавными (1–3 слова) и подпись ниже (до 10 слов), добивающая конкретного участника за его поведение в переписке. Внутри картинки текста нет.
    Настроение: сухой ядовитый сарказм.
- name: wojak
  title: "😐 Мемы Wojak"
  prompt: |
    Мемы в стиле Wojak (Feels Guy, Doomer, Chad, NPC, Soyjak).
    Рисовка: нарочито кривой рисунок как в MS Paint — тонкие неровные чёрные линии, плоские лица, белый или серый фон, минимум деталей. Канонические типажи: Wojak — лысый бледный грустный человечек; Doomer — в чёрной шапке и худи с сигаретой, с синяками под глазами; Chad — квадратная челюсть, борода, уверенный взгляд вверх; NPC — серое лицо без эмоций с точками вместо глаз; Soyjak — разинутый рот, очки, указывает пальцем и визжит от восторга или ужаса; Wojak в маске и в слезах.
    Персонажи — сами участники чата, каждого преврати в тот типаж, который лучше всего описывает его реплики: самоуверенный — Chad, паникёр — плачущий Wojak, кто талдычит одно и то же — NPC, кто бесконечно ждёт ревью — Doomer с сигаретой, кто визжит от «гениального» решения — Soyjak.
    Текст: подпись над каждым типажом в 1–3 слова (роль или диагноз), как в меме-«вирджин против чада».
    Настроение: унизительная точность попадания в типаж.
- name: yellow_press
  title: "📰 Жёлтая пресса"
  prompt: |
    Первая полоса бульварной жёлтой газеты 1990-х.
    Формат: газетная полоса с выдуманным названием издания в шапке (например, «ВЕЧЕРНИЙ ЧАТ» или «СКАНДАЛЫ НЕДЕЛИ»), огромный красный заголовок на всю ширину, жёлтые плашки «ШОК!», «СЕНСАЦИЯ!», «ЭКСКЛЮЗИВ!», крупный фотоколлаж в центре, 2–3 колонки нечитаемого текста, мелкие блоки-рекламы целителей и гороскопов, дешёвая зернистая печать, желтоватая бумага.
    Персонажи — сами участники чата на «фотографиях»: застигнуты врасплох, с красными глазами, обведены красными кружками и стрелками, как в сенсационном репортаже. Главный герой полосы — тот, кто больше всех отличился в переписке.
    Текст: ОДИН главный заголовок (до 7 слов) в стиле жёлтой прессы, превращающий косяк из переписки в скандал века, плюс 1–2 плашки-тизера по 1–2 слова. Остальной текст — неразборчивая имитация.
    Настроение: истерика таблоида из-за пустяка.
- name: wanted_poster
  title: "🤠 Разыскивается"
  prompt: |
    Плакат «РАЗЫСКИВАЕТСЯ» с Дикого Запада (WANTED).
    Рисовка: состаренная жёлто-коричневая бумага с обгоревшими краями и следами пуль, грубая типографская гравюра, портрет в центре — виновник в шляпе, с бандитским прищуром или перепуганным лицом, декоративная рамка, крупный шрифт в стиле вестерна, печать шерифа, гвозди по углам, фон — доска салуна или столб на пыльной улице.
    Персонажи — сами участники чата: главный «преступник» — тот, кто в переписке накосячил сильнее всех; остальные — мелкие сообщники на маленьких портретах снизу или шериф с усами.
    Текст: заголовок «РАЗЫСКИВАЕТСЯ», имя из переписки, преступление в одну строку (до 7 слов, например «За срыв дедлайна и пятисотые ошибки»), награда в рублях или сторипоинтах. Больше текста нет.
    Настроение: торжественное объявление охоты на коллегу.
- name: medieval
  title: "📜 Средневековый манускрипт"
  prompt: |
    Миниатюра из средневекового манускрипта XIII–XV века.
    Рисовка: плоские фигуры без перспективы, золотой лист и тёмно-синий фон с орнаментом, кривые кислые лица с недовольными глазами, тонкие руки с растопыренными пальцами, рыцари в кольчугах, монахи, короли в коронах, на полях — дерущиеся улитки, кролики с мечами и странные звери, узорная рамка, готический шрифт, трещины и потёртости пергамента.
    Персонажи — сами участники чата в средневековых образах: король, шут, монах-переписчик, рыцарь, крестьянин, палач. Кто кем — по репликам: кто раздаёт указания — король; кто ноет — крестьянин на коленях; кто умничает — монах со свитком; кто молчит — палач в капюшоне с топором.
    Текст: одна подпись готическим шрифтом в духе страдающего средневековья (до 10 слов), с мрачным нытьём на псевдостарославянский лад: «Егда же багъ не чинится, а дедлайнъ грядетъ».
    Настроение: вековая тоска и страдание из-за того, что кто-то не ответил в чате.
# Если true — после безопасного получения картинки (canvas, ~1024px) бот дополнительно жмёт
# кнопку «Скачать» в интерфейсе Gemini ради полного размера. Клик иногда роняет headless Chrome;
# квота при этом не теряется (отдаётся уже полученная картинка), а браузер перезапускается
# на следующем запросе. false — довольствоваться картинкой с canvas и кнопку не трогать.
comic_download_fullres: true
image_max_size: 2048
passive_enabled: false
passive_min_messages: 75
passive_prompt_suffix: "Ни в коем случае не оскорбляй участников напрямую"

# Если Gemini выдает ошибку о подозрительном трафике (IP mismatch), укажи прокси
# Например: "http://127.0.0.1:2080" или "socks5://127.0.0.1:10808"
gemini_proxy: ""

local_llm_url: "http://localhost:1234/v1"
local_llm_model: "qwen/qwen3.5-9b"
# Включает подробное логирование запросов/ответов локальной LLM (для отладки RAG)
local_llm_debug: false
# Если true, для генерации финального RAG-ответа (/recall) используется локальная LLM вместо Gemini
rag_use_local_llm_for_response: true
# Модель эмбеддингов для RAG. e5-base заметно точнее MiniLM на русском.
# При смене модели база автоматически пересобирается в новую коллекцию (старые данные не мешают).
embedding_model: "intfloat/multilingual-e5-base"
# Порог косинусной дистанции для векторного поиска (0 = идентично, больше = менее похоже).
# Сообщения с дистанцией выше порога отбрасываются до LLM-фильтра. Меньше = строже отбор.
# ВНИМАНИЕ: у e5 дистанции другие, чем у MiniLM. Подбирай по логам "оставлено/отброшено".
rag_max_distance: 0.35
# Вес свежести при ранжировании кандидатов (0 = только релевантность, 1 = только дата).
# При прочих равных более свежие сообщения получают приоритет.
rag_recency_weight: 0.30
# Сколько кандидатов вытягиваем из векторной базы перед LLM-фильтрацией.
rag_search_limit: 400
# Максимум сообщений в Gemini после строгой LLM-фильтрации (верхняя граница, не цель).
rag_filter_limit: 150
# Размер батча сообщений на один запрос к локальному LLM-фильтру.
rag_filter_batch_size: 100
# До скольки символов обрезается каждое сообщение в промпте фильтра (защита от переполнения).
rag_msg_char_limit: 300
# Минимальная длина сообщения для индексации (короче — шум: «да», «ок», смайлы).
rag_min_message_length: 8
# Лимит токенов ответа локальной LLM (фильтр/переписывание — однострочные ответы).
local_llm_max_tokens: 256
# Сколько последних сообщений берём как контекст для ответа «архитектора».
architect_context: 30
# Время жизни ветки /recall (сек): в её рамках работают уточняющие вопросы.
recall_thread_ttl: 3600
# ID групп, где бот работает (пусто = везде). Пример: - '-1001234567890'
allowed_chat_ids: []
