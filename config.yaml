trigger_keyword: комикс
message_count: 24
cooldown_seconds: 300
# Стили комикса. На каждый комикс случайно выбирается ОДИН элемент списка.
# Шансы равные: чтобы стиль выпадал чаще — продублируй элемент, чтобы убрать — удали его.
# name — слаг для логов и колбэков кнопок, title — русское название для кнопок в Telegram (/comic) и Web UI,
# prompt — описание рисовки и обязательных персонажей.
# reference_image (необязательно) — картинка-референс персонажа, путь относительно папки проекта;
# она прикрепляется к запросу в Gemini, а промпт просит срисовать персонажа с неё.
# Общие правила (чёрный юмор, шутки на заднем плане, русский текст) уже есть в шаблоне в коде.
comic_prompts:
- name: rick_and_morty
  title: "🧪 Рик и Морти"
  prompt: |
    Мультсериал «Рик и Морти» (Rick and Morty, Adult Swim).
    Рисовка: плоская 2D-анимация, толстый чёрный контур, ровная заливка без градиентов, большие круглые белые глаза с маленькими неровными зрачками-«звёздочками», кривые рты, слюна на подбородках.
    Обязательно в кадре Рик Санчез: худой сутулый старик, торчащие шипами серо-голубые волосы, монобровь, белый лабораторный халат поверх голубой водолазки, коричневые брюки, фляжка в руке, презрительное лицо.
    Обязательно в кадре Морти Смит: подросток 14 лет, короткие каштановые волосы, жёлтая футболка, синие штаны, испуганное лицо.
    Детали мира: зелёный светящийся портал и портальная пушка, летающая машина Рика, Мистер Мисикс (голубой человечек с поднятой рукой), Огурчик Рик, плюмбус, инопланетяне, гараж Смитов.
    Настроение: циничная научная фантастика и межпространственный абсурд — Рик язвит и не впечатлён, Морти в панике.
    Остальные участники чата — Саммер, Джерри, Бет и инопланетяне в рисовке сериала.
- name: gromozeka
  title: "👽 Громозека"
  reference_image: references/gromozeka.jpg
  prompt: |
    Мир советского мультфильма «Тайна третьей планеты» (The Mystery of the Third Planet, «Союзмультфильм», 1981): космос, инопланетные планеты, звездолёты, фантастические пейзажи.
    Рисовка: как на приложенном референсе — яркий мультяшный ретро-космос, чистый контур, сочные цвета, выразительная мимика.
    Обязательно в кадре и главный герой сцены — Громозека (Gromozeka), добродушный шестирукий инопланетянин-археолог с планеты Чумароза. Его облик бери ТОЧНО с референса: огромное бочкообразное тело в голубой модульной броне с ремнями и пряжками; ШЕСТЬ сегментированных рук в голубой броне с красно-белыми полосатыми манжетами; короткие ноги в оранжево-красных полосатых штанах и голубых ботинках; большое бежевое лицо без шеи, растущее прямо из туловища; огромный розовый шарообразный нос; широкий рот; растрёпанные зелёные волосы; маленькая антенна с красной спиралью на макушке.
    Громозека — НЕ робот, НЕ осьминог и НЕ человек: это шестирукий инопланетный великан. Он громогласный и сентиментальный: рыдает, обнимает всех шестью руками, пьёт валерьянку из пузырька.
    Второстепенные персонажи в той же рисовке: Алиса Селезнёва (девочка в красном комбинезоне), капитан Зелёный (рыжая борода, вечный пессимист), профессор Селезнёв (в очках), птица Говорун (белая птица с короной).
    Участники чата — это Громозека и остальные герои мультфильма; самую эмоциональную роль играет Громозека.
# Персонажей Marvel (как и всё, что принадлежит Disney) Gemini рисовать отказывается —
# это блокировка на стороне Google, формулировкой промпта она не снимается.
# Поэтому здесь супергеройский комикс с выдуманными героями.
- name: superheroes
  title: "🦸 Супергерои"
  prompt: |
    Супергеройский комикс с ОРИГИНАЛЬНЫМИ героями, придуманными специально для этой сцены.
    Рисовка: классический американский супергеройский комикс — чёткая чёрная тушь, насыщенные цвета, полутоновые точки (halftone), драматические ракурсы снизу, линии скорости, звуковые эффекты крупными буквами.
    Каждый участник чата — отдельный супергерой или суперзлодей, выросший из его реплик в переписке: придумай ему суперсилу, костюм с эмблемой на груди и короткое геройское имя (например, Капитан Дедлайн, Человек-Баг, Леди Продакшн, Доктор Легаси). Костюмы яркие, у каждого свой цвет и силуэт: плащи, маски, броня, нелепые гаджеты.
    Не используй существующих персонажей комиксов, фильмов и игр — все герои, костюмы и эмблемы выдуманы заново.
    Настроение: пафос битвы за судьбу вселенной, применённый к мелкой бытовой или рабочей проблеме из переписки.
- name: dc
  title: "🦇 DC Comics"
  prompt: |
    Вселенная DC Comics в рисовке классических американских комиксов DC.
    Рисовка: чёткая чёрная тушь, глубокие тени, контрастные цвета, драматические ракурсы, звуковые эффекты крупными буквами.
    Обязательно в кадре 2–4 узнаваемых героя или злодея DC в канонических костюмах — выбери тех, чей характер подходит участникам чата: Бэтмен (тёмно-серый костюм, чёрный плащ и маска с ушами, мрачный и молчаливый), Супермен (синий костюм, красный плащ, буква S на груди), Чудо-женщина (тиара и золотое лассо), Флэш (красный костюм с молниями), Аквамен (трезубец), Джокер (зелёные волосы, фиолетовый костюм, безумная улыбка), Харли Квинн (красно-чёрный костюм, бита), Лекс Лютор (лысый злодей в деловом костюме).
    Место действия: мрачный ночной Готэм — дождь, горгульи, Бэт-сигнал в небе — или солнечный Метрополис.
    Настроение: предельно серьёзный героический нуар, применённый к мелкой бытовой или рабочей проблеме из переписки.
# Всё, что принадлежит Disney (Marvel, «Симпсоны», «Гриффины», «Футурама», «Гравити Фолз», Pixar, Star Wars),
